databases:
  # PostgreSQL Database (Persistent with Automatic Backups)
  - name: casaverafurniture-db
    plan: basic-256mb
    databaseName: casaverafurniture
    user: casaverafurniture_user
    postgresMajorVersion: "18"
    # Data is automatically persisted and backed up by Render
    # Backups are retained for 7 days on basic-256mb plan
    # Database remains available even if service restarts

services:
  # Laravel Backend API
  - type: web
    name: casaverafurniture-backend
    runtime: docker
    plan: starter
    region: oregon
    # PHP version is specified in Dockerfile (Laravel 12 requires PHP 8.2+)
    # Health check endpoint
    healthCheckPath: /up
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    preDeployCommand: |
      php artisan migrate --force
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      php artisan optimize
    envVars:
      - key: APP_NAME
        value: CasaVeraFurniture
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_URL
        fromService:
          type: web
          name: casaverafurniture-backend
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: casaverafurniture-frontend
          property: host
      - key: SANCTUM_STATEFUL_DOMAINS
        fromService:
          type: web
          name: casaverafurniture-frontend
          property: host
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: casaverafurniture-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: casaverafurniture-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: casaverafurniture-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: casaverafurniture-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: casaverafurniture-db
          property: password
      - key: SESSION_DRIVER
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: BROADCAST_DRIVER
        value: log
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: APP_KEY
        generateValue: true

  # Vue Frontend
  - type: web
    name: casaverafurniture-frontend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: |
      cd frontend
      npm ci
      npm run build
    startCommand: |
      cd frontend
      npx serve -s dist -l $PORT --single
    envVars:
      - key: VITE_APP_NAME
        value: CasaVera Furniture
      - key: NODE_VERSION
        value: 20.19.0
